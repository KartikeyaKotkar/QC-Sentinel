services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["chroma_data:/app/data/chroma_db"]
    depends_on: [ollama]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]
    restart: unless-stopped

volumes:
  chroma_data:
  ollama_data:
